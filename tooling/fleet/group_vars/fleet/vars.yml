---
# Per-host sudo passwords come from the encrypted vault.local.yml, loaded by
# site.yml via vars_files (NOT from group_vars, so sudo-less playbooks like
# update.yml never trigger a vault prompt). The lookup is lazy and falls back
# to omit, so -K (--ask-become-pass) still works without any vault.
ansible_become_password: "{{ (vault_become_passwords | default({}))[inventory_hostname] | default(omit) }}"
