---
# Per-host privilege-escalation (sudo) passwords come from the ENCRYPTED vault
# file group_vars/fleet/vault.yml (gitignored - this repo is public). Each host
# looks up its own password by name, so the fleet keeps distinct per-server sudo
# passwords instead of a shared one.
#
# Set up once:  ansible-vault create group_vars/fleet/vault.yml   (see vault.yml.example)
# Run playbooks: ansible-playbook site.yml --ask-vault-pass       (one prompt, all hosts)
#
# Without a vault, omit --ask-vault-pass and pass -K (prompts once) with
# --limit <host> so the single password matches one server.
ansible_become_password: "{{ vault_become_passwords[inventory_hostname] }}"
