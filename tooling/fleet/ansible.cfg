[defaults]
inventory = inventory.local.yml
interpreter_python = /usr/bin/python3
# The fleet is 7 hosts; keep runs snappy.
forks = 7
# Roles live next to the playbook.
roles_path = roles
# Tailnet host keys are already in known_hosts from interactive use; accept
# new ones on first contact rather than failing a fresh control node.
host_key_checking = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ConnectTimeout=15
pipelining = True

[privilege_escalation]
become = True
become_method = sudo
# No forced prompt: the become password comes from the encrypted vault
# (group_vars/fleet/vault.yml, per host) unlocked with --ask-vault-pass. The
# fleet deliberately has no NOPASSWD sudo. Without a vault, pass -K explicitly
# (add --limit <host> so the single prompt matches one server's password).
become_ask_pass = False
