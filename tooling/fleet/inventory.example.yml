# Copy to inventory.local.yml (gitignored) and fill in the real host names
# and tailnet IPs. This repo is PUBLIC: server names and addresses live only
# in the private fleet docs and in your local copy. Find the addresses with
# `tailscale status`.
#
# One entry per production server. Use the same short names as your ssh
# config / MagicDNS so `--limit <name>` works intuitively.
fleet:
  hosts:
    server1:
      ansible_host: "<tailnet-ip>"
    server2:
      ansible_host: "<tailnet-ip>"
    server3:
      ansible_host: "<tailnet-ip>"
  vars:
    ansible_user: "<deploy-user>"
    ansible_ssh_private_key_file: ~/.ssh/<deploy-key>
    # Optional: source IPs whose ufw allow rules should be removed on 22/443
    # (e.g. a retired office/VPN address). Kept here, not in the public repo.
    # retired_allow_sources: ["203.0.113.9"]
